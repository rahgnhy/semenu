name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Toolchain check
        shell: pwsh
        run: |
          node -v
          npm -v
          npx --no-install electron-builder --version

      # Failure text is surfaced as a check-run annotation so the error is
      # readable without downloading the job log.
      - name: Build
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 25) -join ' | '
            Write-Host "::error title=Build failed::$tail"
            exit 1
          }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/semenu-v*-Setup.exe
            dist/semenu-v*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
