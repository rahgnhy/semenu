appId: com.sside.semenu
productName: SE-MENU
copyright: Copyright © 2026 sside

directories:
  output: dist
  buildResources: assets

files:
  - src/**
  - assets/**
  - package.json
  - "!**/*.map"

extraResources:
  - from: assets/OpenCode-Infinite.bat
    to: assets/OpenCode-Infinite.bat
  - from: assets/tools/il2cppdumper
    to: assets/tools/il2cppdumper

win:
  target:
    - nsis
    - portable
  icon: assets/icon.ico
  executableName: semenu

# Artifact names come from the package.json version, so a bump is one edit and
# the shipped files always read semenu-v<version>.exe / semenu-v<version>-Setup.exe.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  shortcutName: SE-MENU
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  artifactName: semenu-v${version}-Setup.${ext}
  runAfterFinish: true

portable:
  artifactName: semenu-v${version}.${ext}
