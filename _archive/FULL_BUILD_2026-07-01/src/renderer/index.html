<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https:; media-src 'self' blob:;">
  <title>SE-MENU</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="icon" href="../../assets/icon-32.png">
</head>
<body>

  <!-- ====================================================== splash -->
  <div id="splash">
    <div class="splash-mark" id="splash-mark"></div>
    <div class="splash-title">SE-MENU</div>
    <div class="splash-bar"></div>
    <div class="splash-status" id="splash-status">initializing…</div>
  </div>

  <!-- ====================================================== app -->
  <div id="app" style="visibility:hidden">
    <div id="aurora">
      <div class="aur-blob b1"></div>
      <div class="aur-blob b2"></div>
      <div class="aur-blob b3"></div>
      <div class="aur-blob b4"></div>
      <div class="aur-grid"></div>
      <div class="aur-noise"></div>
      <div class="aur-vignette"></div>
    </div>
    <div class="app-surface"></div>

    <div class="app-body">
      <!-- sidebar -->
      <aside class="sidebar">
        <div class="side-logo">
          <div class="mark" data-icon="se-menu"></div>
          <div class="text">
            <div class="name">SE-MENU</div>
            <div class="tag">Test Console</div>
          </div>
        </div>
        <div class="side-label">Workspace</div>
        <nav class="side-nav" id="side-nav"></nav>
        <div class="side-foot">
          <div class="side-status" id="side-status">
            <span class="dot" id="side-status-dot"></span>
            <span class="ss-text" id="side-status-text">Ready</span>
          </div>
          <div class="side-meta" id="side-meta">v1.0.0</div>
        </div>
      </aside>

      <!-- main -->
      <main class="content">
        <header class="titlebar">
          <div class="titlebar-drag">
            <div class="tb-mark" data-icon="se-menu"></div>
            <div class="tb-title">SE-MENU<span class="tb-sub">Test Console</span></div>
            <div class="tb-version" id="tb-version">v1.0.0</div>
            <div class="tb-tab-title" id="tb-tab-title">Test</div>
          </div>
          <div class="tb-actions">
            <button class="tb-btn" id="btn-update" data-tip="Updates — check for new versions" data-tip-pos="bottom">
              <span data-icon="download-cloud"></span>
            </button>
            <button class="tb-btn" id="btn-settings" data-tip="Settings — appearance, animations, updates" data-tip-pos="bottom">
              <span data-icon="settings"></span>
            </button>
            <div class="tb-sep"></div>
            <button class="tb-btn" id="btn-min" data-tip="Minimize" data-tip-pos="bottom"><span data-icon="minus"></span></button>
            <button class="tb-btn" id="btn-max" data-tip="Maximize" data-tip-pos="bottom"><span data-icon="maximize"></span></button>
            <button class="tb-btn tb-close" id="btn-close" data-tip="Close" data-tip-pos="bottom"><span data-icon="x"></span></button>
          </div>
        </header>
        <div class="content-scroll" id="content-scroll">
          <div class="content-inner" id="content-inner"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="tooltip"></div>
  <div id="toasts"></div>

  <!-- ====================================================== TEST tab template -->
  <template id="tpl-tab-test">
    <div class="tab-page" id="tab-test">

      <div class="page-head">
        <div>
          <div class="page-title">Test <span class="accent">Console</span></div>
          <div class="page-sub">Every probe, sensor and control in one playground — live measurements, real data, zero mocks.</div>
        </div>
        <div class="page-chips">
          <span class="chip"><span class="dot" style="color:var(--ok);background:var(--ok)"></span>CPU <b id="chip-cpu">—</b></span>
          <span class="chip"><span class="dot" style="color:var(--acc-2);background:var(--acc-2)"></span>RAM <b id="chip-ram">—</b></span>
          <span class="chip"><span class="dot" style="color:var(--acc-1);background:var(--acc-1)"></span>Ping <b id="chip-ping">—</b></span>
          <span class="chip"><span class="dot" style="color:var(--acc-3);background:var(--acc-3)"></span>FPS <b id="chip-fps">—</b></span>
          <span class="chip"><span class="dot" style="color:var(--warn);background:var(--warn)"></span>Uptime <b id="chip-uptime">—</b></span>
        </div>
      </div>

      <!-- ==================== NETWORK ==================== -->
      <section class="card" id="card-network">
        <div class="card-head">
          <div class="card-icon" data-icon="globe"></div>
          <div class="card-head-text">
            <div class="card-title">Network Lab</div>
            <div class="card-sub">Live ping, throughput, DNS, traceroute and interface telemetry</div>
          </div>
          <div class="card-actions">
            <span class="badge acc" id="net-status-badge"><span class="dot"></span><span id="net-status-text">Idle</span></span>
            <button class="btn btn-sm" id="net-ping-toggle"><span data-icon="play"></span><span id="net-ping-toggle-label">Start ping</span></button>
            <button class="btn btn-sm btn-ghost" id="net-trace-btn"><span data-icon="route"></span>Traceroute</button>
          </div>
        </div>
        <div class="card-body">
          <div class="mon-grid" style="grid-template-columns: 1.55fr 1fr;">
            <div class="subpanel">
              <div class="subpanel-title"><span data-icon="activity"></span>Ping monitor</div>
              <div class="row between center wrap">
                <div>
                  <div class="ping-readout"><span id="ping-value">—</span><span class="unit">ms</span></div>
                  <div class="row center" style="gap:7px;margin-top:7px">
                    <span class="dot" id="ping-dot" style="width:8px;height:8px;border-radius:50%;background:var(--text-3)"></span>
                    <span class="mono" style="font-size:.72rem;color:var(--text-3)" id="ping-status">Idle — press start</span>
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">Target host</label>
                  <div class="row" style="gap:7px">
                    <input class="input mono" id="ping-host" value="1.1.1.1" style="width:140px">
                    <select class="select" id="ping-preset" style="width:104px">
                      <option value="1.1.1.1">Cloudflare</option>
                      <option value="8.8.8.8">Google</option>
                      <option value="9.9.9.9">Quad9</option>
                      <option value="208.67.222.222">OpenDNS</option>
                      <option value="custom">Custom…</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="chart-wrap tall"><canvas id="ping-chart"></canvas></div>
              <div class="stat-row" style="margin-top:10px">
                <div class="stat"><div class="stat-label">Average</div><div class="stat-value" id="ping-avg">—</div></div>
                <div class="stat"><div class="stat-label">Min</div><div class="stat-value" id="ping-min">—</div></div>
                <div class="stat"><div class="stat-label">Max</div><div class="stat-value" id="ping-max">—</div></div>
                <div class="stat"><div class="stat-label">Jitter</div><div class="stat-value" id="ping-jitter">—</div></div>
                <div class="stat"><div class="stat-label">Loss</div><div class="stat-value" id="ping-loss">—</div></div>
                <div class="stat"><div class="stat-label">Samples</div><div class="stat-value" id="ping-samples">0</div></div>
              </div>
            </div>

            <div class="col">
              <div class="subpanel">
                <div class="subpanel-title"><span data-icon="gauge"></span>Speed test</div>
                <div class="row center" style="gap:14px;justify-content:space-around">
                  <div class="gauge-wrap">
                    <div class="gauge"><canvas id="gauge-down"></canvas><div class="gauge-center"><div class="gauge-value" id="speed-down-value">—</div><div class="gauge-unit">Mbps</div></div></div>
                    <div class="gauge-label">Download</div>
                  </div>
                  <div class="gauge-wrap">
                    <div class="gauge"><canvas id="gauge-up"></canvas><div class="gauge-center"><div class="gauge-value" id="speed-up-value">—</div><div class="gauge-unit">Mbps</div></div></div>
                    <div class="gauge-label">Upload</div>
                  </div>
                </div>
                <div class="progress" style="margin-top:12px"><div class="fill" id="speed-progress" style="width:0%"></div></div>
                <div class="row center" style="gap:8px;margin-top:12px;flex-wrap:wrap">
                  <button class="btn btn-primary btn-sm" id="speed-start"><span data-icon="zap"></span>Run speed test</button>
                  <span class="mono" style="font-size:.7rem;color:var(--text-3)" id="speed-status">Idle</span>
                </div>
                <div class="mono" style="font-size:.66rem;color:var(--text-3);margin-top:8px" id="speed-detail">Endpoints are configurable in Settings → Updates & Network.</div>
              </div>

              <div class="subpanel grow">
                <div class="subpanel-title"><span data-icon="wifi"></span>Connectivity &amp; interfaces</div>
                <div class="row" style="gap:8px;flex-wrap:wrap">
                  <button class="btn btn-sm" id="net-extip"><span data-icon="globe"></span>Public IP</button>
                  <span class="mono" id="extip-value" style="font-size:.74rem;color:var(--text-2)">—</span>
                </div>
                <div class="row" style="gap:7px;margin-top:10px;flex-wrap:wrap">
                  <input class="input mono" id="dns-host" placeholder="example.com" style="width:140px">
                  <select class="select" id="dns-type" style="width:88px">
                    <option>A</option><option>AAAA</option><option>MX</option><option>TXT</option><option>NS</option><option>CNAME</option>
                  </select>
                  <button class="btn btn-sm" id="dns-lookup"><span data-icon="search"></span>Resolve</button>
                </div>
                <div class="mono" id="dns-result" style="font-size:.7rem;color:var(--text-2);margin-top:8px;min-height:1.2em;word-break:break-all">—</div>
                <div class="divider"></div>
                <div class="col" id="iface-list" style="gap:3px;max-height:140px;overflow-y:auto"></div>
              </div>
            </div>
          </div>

          <div class="subpanel" style="margin-top:12px">
            <div class="subpanel-title"><span data-icon="route"></span>Traceroute</div>
            <div class="row" style="gap:8px;flex-wrap:wrap">
              <input class="input mono" id="trace-host" placeholder="1.1.1.1" style="width:150px">
              <button class="btn btn-sm" id="trace-start"><span data-icon="play"></span>Trace</button>
              <button class="btn btn-sm btn-ghost" id="trace-clear">Clear</button>
              <span class="mono" style="font-size:.7rem;color:var(--text-3)" id="trace-status">Idle</span>
            </div>
            <div id="trace-results" style="margin-top:10px"></div>
          </div>
        </div>
      </section>

      <!-- ==================== SYSTEM ==================== -->
      <section class="card" id="card-system">
        <div class="card-head">
          <div class="card-icon" data-icon="cpu"></div>
          <div class="card-head-text">
            <div class="card-title">System Monitor</div>
            <div class="card-sub">CPU, memory, disk, GPU and hardware telemetry — polled live from the OS</div>
          </div>
          <div class="card-actions">
            <span class="badge" id="sys-os-badge">—</span>
          </div>
        </div>
        <div class="card-body">
          <div class="mon-grid">
            <div class="mon-tile wide">
              <div class="mon-head">
                <div class="mh-icon" data-icon="cpu"></div>
                <div class="mh-title">CPU utilization</div>
                <div class="mh-value" id="cpu-value">—</div>
              </div>
              <div class="mon-chart" style="height:110px"><canvas id="cpu-chart"></canvas></div>
              <div class="chart-legend" id="cpu-legend"></div>
            </div>
            <div class="mon-tile wide">
              <div class="mon-head">
                <div class="mh-icon" data-icon="memory"></div>
                <div class="mh-title">Memory</div>
                <div class="mh-value" id="ram-value">—</div>
              </div>
              <div class="mon-chart" style="height:110px"><canvas id="ram-chart"></canvas></div>
              <div class="chart-legend" id="ram-legend"></div>
            </div>

            <div class="mon-tile">
              <div class="mon-head">
                <div class="mh-icon" data-icon="app"></div>
                <div class="mh-title">App memory</div>
                <div class="mh-value" id="app-mem-value">—</div>
              </div>
              <div class="progress" style="margin:6px 0 10px"><div class="fill" id="app-mem-bar" style="width:0%"></div></div>
              <dl class="kv" id="app-mem-kv"></dl>
            </div>

            <div class="mon-tile">
              <div class="mon-head">
                <div class="mh-icon" data-icon="disk"></div>
                <div class="mh-title">Disks</div>
              </div>
              <div class="col" id="disk-list" style="gap:9px"></div>
            </div>

            <div class="mon-tile">
              <div class="mon-head">
                <div class="mh-icon" data-icon="gpu"></div>
                <div class="mh-title">GPU</div>
              </div>
              <div class="col" id="gpu-list" style="gap:6px"></div>
            </div>

            <div class="mon-tile">
              <div class="mon-head">
                <div class="mh-icon" data-icon="clock"></div>
                <div class="mh-title">Uptime &amp; power</div>
              </div>
              <dl class="kv" id="uptime-kv"></dl>
            </div>

            <div class="mon-tile wide">
              <div class="mon-head">
                <div class="mh-icon" data-icon="box"></div>
                <div class="mh-title">Hardware</div>
              </div>
              <div class="row wrap" id="hw-chips" style="gap:7px"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ==================== TIME ==================== -->
      <section class="card" id="card-time">
        <div class="card-head">
          <div class="card-icon" data-icon="clock"></div>
          <div class="card-head-text">
            <div class="card-title">Time Lab</div>
            <div class="card-sub">Clock, stopwatch with laps, countdown and session tracking</div>
          </div>
          <div class="card-actions">
            <span class="badge acc" id="session-badge">Session 00:00:00</span>
          </div>
        </div>
        <div class="card-body">
          <div class="time-grid">
            <div class="subpanel">
              <div class="subpanel-title"><span data-icon="clock"></span>Local clock</div>
              <div class="clock-big" id="clock-time">00:00:00<span class="clock-ms" id="clock-ms">.000</span></div>
              <div class="mono" id="clock-date" style="font-size:.76rem;color:var(--text-2);margin-top:9px">—</div>
              <div class="mono" id="clock-tz" style="font-size:.68rem;color:var(--text-3);margin-top:4px">—</div>
              <div class="divider"></div>
              <div class="row" style="gap:14px;flex-wrap:wrap">
                <label class="checkbox"><input type="checkbox" id="clock-24h" checked><span class="box" data-icon="check"></span>24-hour</label>
                <label class="checkbox"><input type="checkbox" id="clock-ms-toggle" checked><span class="box" data-icon="check"></span>Milliseconds</label>
              </div>
            </div>

            <div class="subpanel">
              <div class="subpanel-title"><span data-icon="timer"></span>Stopwatch</div>
              <div class="clock-big" id="stopwatch-time" style="font-size:2rem">00:00.000</div>
              <div class="row" style="gap:7px;margin:12px 0">
                <button class="btn btn-primary btn-sm" id="sw-start"><span data-icon="play"></span><span id="sw-start-label">Start</span></button>
                <button class="btn btn-sm" id="sw-lap"><span data-icon="flag"></span>Lap</button>
                <button class="btn btn-sm btn-ghost" id="sw-reset"><span data-icon="reset"></span>Reset</button>
              </div>
              <div class="col" id="sw-laps" style="gap:3px;max-height:104px;overflow-y:auto">
                <div class="empty-state" style="padding:12px">No laps yet</div>
              </div>
            </div>

            <div class="subpanel">
              <div class="subpanel-title"><span data-icon="hourglass"></span>Countdown</div>
              <div class="countdown-ring">
                <canvas id="countdown-ring"></canvas>
                <div class="countdown-center"><div class="countdown-value" id="countdown-value">05:00</div></div>
              </div>
              <div class="row center" style="gap:7px;margin:12px 0;justify-content:center">
                <input class="input mono" id="cd-min" type="number" min="0" max="999" value="5" style="width:66px;text-align:center">
                <span class="muted">:</span>
                <input class="input mono" id="cd-sec" type="number" min="0" max="59" value="0" style="width:66px;text-align:center">
                <button class="btn btn-primary btn-sm" id="cd-start"><span data-icon="play"></span><span id="cd-start-label">Start</span></button>
                <button class="btn btn-sm btn-ghost" id="cd-reset"><span data-icon="reset"></span></button>
              </div>
              <div class="row center" style="gap:6px;justify-content:center;flex-wrap:wrap">
                <button class="btn btn-sm btn-ghost" data-cd-preset="1:00">1m</button>
                <button class="btn btn-sm btn-ghost" data-cd-preset="5:00">5m</button>
                <button class="btn btn-sm btn-ghost" data-cd-preset="10:00">10m</button>
                <button class="btn btn-sm btn-ghost" data-cd-preset="25:00">25m</button>
              </div>
            </div>

            <div class="subpanel">
              <div class="subpanel-title"><span data-icon="activity"></span>Session</div>
              <dl class="kv">
                <dt>Session</dt><dd id="session-time">00:00:00</dd>
                <dt>System uptime</dt><dd id="system-uptime">—</dd>
                <dt>Process uptime</dt><dd id="process-uptime">—</dd>
                <dt>Time zone</dt><dd id="tz-name">—</dd>
                <dt>Clock drift</dt><dd id="clock-drift">—</dd>
              </dl>
              <div class="divider"></div>
              <div class="row" style="gap:8px;flex-wrap:wrap">
                <button class="btn btn-sm btn-ghost" id="btn-copy-time"><span data-icon="copy"></span>Copy timestamp</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ==================== ANIMATION ==================== -->
      <section class="card" id="card-anim">
        <div class="card-head">
          <div class="card-icon" data-icon="sparkles"></div>
          <div class="card-head-text">
            <div class="card-title">Animation Lab</div>
            <div class="card-sub">Motion previews, loaders and timing controls — every animation is live and adjustable</div>
          </div>
          <div class="card-actions">
            <span class="badge" id="anim-state-badge">Stopped</span>
          </div>
        </div>
        <div class="card-body">
          <div class="mon-grid" style="grid-template-columns: 1.2fr 1fr;">
            <div class="subpanel">
              <div class="subpanel-title"><span data-icon="play"></span>Preview stage</div>
              <div class="anim-stage" id="anim-stage">
                <div class="stage-grid"></div>
                <div class="anim-obj circle anim-type-se-menu" id="anim-obj"></div>
              </div>
              <div class="anim-toolbar">
                <div class="field">
                  <label class="field-label">Type</label>
                  <select class="select" id="anim-type">
                    <option value="se-menu">Breathe</option>
                    <option value="bounce">Bounce</option>
                    <option value="spin">Spin</option>
                    <option value="swing">Swing</option>
                    <option value="jelly">Jelly</option>
                    <option value="morph">Morph</option>
                    <option value="wave">Wave</option>
                    <option value="orbit">Orbit</option>
                  </select>
                </div>
                <div class="field grow">
                  <label class="field-label">Speed <span class="mono" id="anim-speed-val">1.0×</span></label>
                  <div class="slider"><input type="range" id="anim-speed" min="0.25" max="3" step="0.05" value="1"></div>
                </div>
                <div class="field grow">
                  <label class="field-label">Intensity <span class="mono" id="anim-intensity-val">1.0×</span></label>
                  <div class="slider"><input type="range" id="anim-intensity" min="0.1" max="2" step="0.05" value="1"></div>
                </div>
                <div class="field">
                  <label class="field-label">Shape</label>
                  <select class="select" id="anim-shape">
                    <option value="circle">Circle</option>
                    <option value="rounded">Rounded</option>
                    <option value="square">Square</option>
                    <option value="pill">Pill</option>
                  </select>
                </div>
                <div class="row" style="gap:7px;align-self:flex-end">
                  <button class="btn btn-primary btn-sm" id="anim-play"><span data-icon="play"></span>Play</button>
                  <button class="btn btn-sm btn-ghost" id="anim-stop"><span data-icon="pause"></span>Stop</button>
                </div>
              </div>
            </div>

            <div class="subpanel">
              <div class="subpanel-title"><span data-icon="loader"></span>Loader gallery</div>
              <div class="pg-grid cols-4" id="loader-gallery" style="gap:14px"></div>
              <div class="divider"></div>
              <div class="subpanel-title"><span data-icon="mouse"></span>Interactive motion</div>
              <div class="pg-grid cols-3" style="gap:10px">
                <div class="interactive-card" id="demo-hover-lift" style="padding:11px;text-align:center">
                  <div class="ic-title" style="font-size:.78rem">Hover lift</div>
                  <div class="ic-sub">translateY + shadow</div>
                </div>
                <div class="interactive-card" id="demo-tilt" style="padding:11px;text-align:center">
                  <div class="ic-title" style="font-size:.78rem">3D tilt</div>
                  <div class="ic-sub">pointer-tracked</div>
                </div>
                <div class="interactive-card" id="demo-glow" style="padding:11px;text-align:center">
                  <div class="ic-title" style="font-size:.78rem">Glow border</div>
                  <div class="ic-sub">conic gradient</div>
                </div>
              </div>
              <div class="divider"></div>
              <div class="subpanel-title"><span data-icon="wand"></span>Animated buttons</div>
              <div class="row" style="gap:9px;flex-wrap:wrap">
                <button class="btn btn-primary ripple-host" id="ab-shine">Shine</button>
                <button class="btn btn-gradient-border" id="ab-border">Gradient border</button>
                <button class="btn btn-ghost" id="ab-magnetic">Magnetic</button>
                <button class="btn btn-ok ripple-host" id="ab-ripple">Ripple</button>
              </div>
            </div>
          </div>

          <div class="subpanel" style="margin-top:12px">
            <div class="subpanel-title"><span data-icon="chart"></span>Animated chart preview</div>
            <div class="chart-wrap" style="height:120px"><canvas id="anim-chart"></canvas></div>
          </div>
        </div>
      </section>

      <!-- ==================== PERFORMANCE ==================== -->
      <section class="card" id="card-perf">
        <div class="card-head">
          <div class="card-icon" data-icon="zap"></div>
          <div class="card-head-text">
            <div class="card-title">Performance Bench</div>
            <div class="card-sub">Frame rate, frame time, heap, event-loop lag and CPU benchmark</div>
          </div>
          <div class="card-actions">
            <span class="badge acc" id="fps-badge">— FPS</span>
          </div>
        </div>
        <div class="card-body">
          <div class="mon-grid">
            <div class="mon-tile wide">
              <div class="mon-head">
                <div class="mh-icon" data-icon="activity"></div>
                <div class="mh-title">Frame rate</div>
                <div class="mh-value" id="fps-value">—</div>
              </div>
              <div class="mon-chart" style="height:100px"><canvas id="fps-chart"></canvas></div>
            </div>
            <div class="mon-tile wide">
              <div class="mon-head">
                <div class="mh-icon" data-icon="timer"></div>
                <div class="mh-title">Frame time</div>
                <div class="mh-value" id="frame-value">—</div>
              </div>
              <div class="mon-chart" style="height:100px"><canvas id="frame-chart"></canvas></div>
            </div>
            <div class="mon-tile">
              <div class="mon-head">
                <div class="mh-icon" data-icon="memory"></div>
                <div class="mh-title">JS heap</div>
                <div class="mh-value" id="heap-value">—</div>
              </div>
              <div class="mon-chart" style="height:80px"><canvas id="heap-chart"></canvas></div>
            </div>
            <div class="mon-tile">
              <div class="mon-head">
                <div class="mh-icon" data-icon="cpu"></div>
                <div class="mh-title">Event loop lag</div>
                <div class="mh-value" id="lag-value">—</div>
              </div>
              <div class="mon-chart" style="height:80px"><canvas id="lag-chart"></canvas></div>
            </div>
            <div class="mon-tile wide">
              <div class="mon-head">
                <div class="mh-icon" data-icon="gauge"></div>
                <div class="mh-title">CPU benchmark</div>
                <div class="mh-value" id="bench-value">—</div>
              </div>
              <div class="row center" style="gap:9px;flex-wrap:wrap;margin-bottom:9px">
                <button class="btn btn-primary btn-sm" id="bench-run"><span data-icon="play"></span>Run benchmark</button>
                <span class="mono" style="font-size:.7rem;color:var(--text-3)" id="bench-status">Prime sieve + 128² matrix multiply</span>
              </div>
              <div class="progress" style="margin-bottom:10px"><div class="fill" id="bench-progress" style="width:0%"></div></div>
              <div class="col" id="bench-history" style="gap:3px;max-height:110px;overflow-y:auto">
                <div class="empty-state" style="padding:10px">No runs yet</div>
              </div>
            </div>
            <div class="mon-tile">
              <div class="mon-head">
                <div class="mh-icon" data-icon="mouse"></div>
                <div class="mh-title">Input latency</div>
                <div class="mh-value" id="latency-value">—</div>
              </div>
              <div class="col" style="gap:8px;margin-top:2px;align-items:flex-start">
                <button class="btn btn-sm" id="latency-run"><span data-icon="play"></span>Measure click latency</button>
                <div class="mono" style="font-size:.68rem;color:var(--text-3)" id="latency-status">Measures render → input pipeline delay</div>
                <div class="row" style="gap:6px;flex-wrap:wrap" id="latency-history"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ==================== DEVTOOLS ==================== -->
      <section class="card" id="card-devtools">
        <div class="card-head">
          <div class="card-icon" data-icon="terminal"></div>
          <div class="card-head-text">
            <div class="card-title">Developer Console</div>
            <div class="card-sub">Live event log, diagnostics, connectivity checks and test history</div>
          </div>
          <div class="card-actions">
            <button class="btn btn-sm" id="dev-export"><span data-icon="export"></span>Export report</button>
            <button class="btn btn-sm btn-ghost" id="dev-copy"><span data-icon="copy"></span>Copy logs</button>
            <button class="btn btn-sm btn-ghost" id="dev-clear"><span data-icon="trash"></span>Clear</button>
          </div>
        </div>
        <div class="card-body tight">
          <div class="tabs" id="dev-tabs">
            <button class="tab active" data-dev-tab="log"><span data-icon="list"></span>Event log <span class="count" id="dev-log-count">0</span></button>
            <button class="tab" data-dev-tab="console"><span data-icon="terminal"></span>Console</button>
            <button class="tab" data-dev-tab="diag"><span data-icon="info"></span>Diagnostics</button>
            <button class="tab" data-dev-tab="api"><span data-icon="globe"></span>Connectivity</button>
            <button class="tab" data-dev-tab="tasks"><span data-icon="layers"></span>Background tasks</button>
            <button class="tab" data-dev-tab="history"><span data-icon="history"></span>Test history</button>
          </div>
          <div style="padding-top:14px">
            <div class="dev-pane" data-dev-pane="log"><div class="log-view" id="dev-log"></div></div>
            <div class="dev-pane hidden" data-dev-pane="console"><div class="log-view" id="dev-console"></div></div>
            <div class="dev-pane hidden" data-dev-pane="diag"><div id="dev-diag"></div></div>
            <div class="dev-pane hidden" data-dev-pane="api"><div id="dev-api"></div></div>
            <div class="dev-pane hidden" data-dev-pane="tasks"><div id="dev-tasks"></div></div>
            <div class="dev-pane hidden" data-dev-pane="history"><div id="dev-history"></div></div>
          </div>
        </div>
      </section>

      <!-- ==================== PLAYGROUND ==================== -->
      <section class="card" id="card-playground">
        <div class="card-head">
          <div class="card-icon" data-icon="layers"></div>
          <div class="card-head-text">
            <div class="card-title">Component Playground</div>
            <div class="card-sub">Every control is live — drag, toggle, type, hover and click</div>
          </div>
          <div class="card-actions">
            <span class="badge" id="pg-badge">0 interactions</span>
          </div>
        </div>
        <div class="card-body" id="playground-body"></div>
      </section>

      <!-- ==================== UTILITIES ==================== -->
      <section class="card" id="card-utilities">
        <div class="card-head">
          <div class="card-icon" data-icon="box"></div>
          <div class="card-head-text">
            <div class="card-title">Utility Bench</div>
            <div class="card-sub">Extra probes and tools — hashing, encoding, formatters, capture and sensors</div>
          </div>
        </div>
        <div class="card-body">
          <div class="util-grid" id="util-grid"></div>
        </div>
      </section>

    </div>
  </template>

  <script src="js/animlab.js"></script>
  <script src="js/perf.js"></script>
  <script src="js/devtools.js"></script>
  <script src="js/playground.js"></script>
  <script src="js/utilities.js"></script>
  <script src="js/updater-ui.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/selftest.js"></script>
  <script src="js/app.js"></script>
</body>
