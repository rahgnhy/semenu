appId: com.se-menulabs.console
productName: SE-MENU
copyright: Copyright © 2026 sside

directories:
  output: dist
  buildResources: assets

files:
  - src/**
  - assets/**
  - package.json
  - "!**/*.map"
  - "!assets/fonts/*.css"

win:
  target:
    - nsis
    - portable
  icon: assets/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  shortcutName: SE-MENU
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  artifactName: se-menu-Setup-${version}.${ext}

portable:
  artifactName: se-menu-Portable-${version}.${ext}
